<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"><script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <title>History - Business Dashboard</title>

<body>

{% include "_nav.html" %}

    <main class="app-main">
        <div class="page-header">
            <h2>Report History</h2>
            <p>Every report you've uploaded or imported in this workspace. Check two to compare them.</p>
        </div>

        <div class="history-toolbar">
            <button class="btn-primary" id="compareBtn" type="button" style="width: auto;">Compare selected (2)</button>

        <div id="historyTable" class="history-table"></div>

        <div id="compareSection" style="display: none; margin-top: 32px;">
            <h3 style="color: #fff;font-size: 14px;margin-bottom: 10px;">Comparison</h3>
            <div class="compare-grid" id="compareGrid"></div>
        </div>
    </main>

    <script src="/static/js/common.js"></script>
