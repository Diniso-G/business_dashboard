<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>
    <title>Business Dashboard</title>
</head>
<body>
    <h1>Begin</h1>
    <h2>Business Analytics Dashboard</h2>
    <p>Upload a CSV or EXCEL file to get Started/</p>
    <div id="authSection">
        <div id="authMessage"></div>
        <div id="loginForm">
            <h3>Login</h3>
            <input type="email" id="loginEmail" placeholder="Email" required>
            <input type="password" id="loginPassword" placeholder="Password" required>

            <button id="loginBtn">Login</button>
            <p>No account? <a href="#" id="showRegister">Register</a> </p>
        </div>
        <div id="registerForm" style="display:none;">
            <h3>Register</h3>
            <input type="email" id="registerEmail" placeholder="Email" required>
            <input type="password" id="registerPassword" placeholder="Password" required>

            <button id="registerBtn">Register</button>
            <p>Already have an account? <a href="#" id="showLogin">Login</a> </p>
        </div>
    </div>
    <div id="dashboardSection" style="display:none;">
        <p>Logged in as <span id="userEmailDisplay"></span> &mdash;
        <a href="#" id="logoutBtn">Log out</a> </p>

        <form id="uploadForm">
            <input type="file" id="fileInput" name="file" accept=".csv,.xlsx" required>
            <button type="submit">UPLOAD &ANALYSE</button>
        </form>
        <div id="results"></div>
        <div id="chart__revenue"></div>
        <div id="chart__bestsellers"></div>
    </div>
    <script>
        const form = document.getElementById("uploadForm")
        const resdiv = document.getElementById("results")

        form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const fileInput = document.getElementById("fileInput")

        if (!fileInput.files[0]){
        resdiv.innerHTML = "Please choose a file first.";
        return;
        }

        const formData = new FormData();
        formData.append("file", fileInput.files[0]);
        resdiv.innerHTML = "Analysing...";

        try{
            const respo = await fetch("/upload", {method: "POST", body: formData});
            if (!respo.ok){
                const errText = await respo.text();
                resdiv.innerHTML = "<p>Error: " + errText + "<p>";
                return;
            }
            const data = await respo.json();
            let html = "<h3>Analysis Results</h3>";
            html+= "<pre>" + JSON.stringify(Object.fromEntries(Object.entries(data).filter(([d]) => d !=="ai_recommendations" && d!== "charts")),
            null, 2) + "</pre>";

            if (data.ai_recommendations){
                html += "<h3>AI Recommendations</h3>";
                html += "<div style = 'white-space: pre-wrap; line-height:1.5;'>" + data.ai_recommendations + "</div>";
                }
            resdiv.innerHTML = html;

            if (data.charts){
                if (data.charts.revenue_trend){
                    Plotly.newPlot("chart__revenue", data.charts.revenue_trend.data, data.charts.revenue_trend.layout);
                }
                if (data.charts.best_sellers){
                    Plotly.newPlot("chart__bestsellers", data.charts.best_sellers.data, data.charts.best_sellers.layout);
                }
            }
        } catch (err){
            resdiv.innerHTML = "<p> Network error: " + err.message + "</p>";
        }
        });
    </script>
    </body>
</html>
